# A tag like v1.2.0 builds Hatha.exe and attaches it to that version's release. The tag can come from git
# (git tag -a v1.2.0 -m "..." && git push origin v1.2.0; the message becomes the notes) or from drafting
# the release on GitHub with a new tag, in which case the notes written there stay as they are.
# The version baked into the exe (AssemblyVersion in src\Program.cs) must match the tag.
name: Release

on:
  push:
    tags: ["v*", "V*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: cmd /c build.bat

      - name: Unit tests
        run: cmd /c tests\run.bat

      - name: Check the exe carries the tag's version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("vV")
          $exe = (Get-Item Hatha.exe).VersionInfo.FileVersion
          if ($exe -ne "$tag.0") { throw "Hatha.exe is version $exe but the tag says $tag. Bump AssemblyVersion in src\Program.cs." }

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { gh release upload $tag Hatha.exe --clobber }
          else { gh release create $tag Hatha.exe --title "هاتها $tag" --notes-from-tag }
